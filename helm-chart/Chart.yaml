# Chart.yamlは、Helmチャートの基本的な情報を定義する重要なファイルです。
# このファイルは、チャートのメタデータを含み、Kubernetesクラスタへのデプロイ時に
# 参照される重要な情報を提供します。

# apiVersionは、使用するHelmのバージョンを指定します。
# v2は、Helm 3.xで使用される最新のバージョンです。
apiVersion: v2

# nameは、このHelmチャートの名前です。
# この名前は、Kubernetesクラスタ内でチャートを識別するために使用されます。
name: helm-chart

# descriptionは、このチャートの目的や機能を説明する文字列です。
# チームの他のメンバーがこのチャートの用途を理解するのに役立ちます。
description: A Helm chart for Kubernetes

# typeは、このチャートの種類を指定します。
# 以下の2種類があります：
# - application: 実際にデプロイ可能なアプリケーションチャート
# - library: 他のチャートで再利用可能な共通機能を提供するライブラリチャート
# Application chartsは、Kubernetesクラスタにデプロイ可能なテンプレートの集まりです。
# Library chartsは、他のチャートで使用される共通の関数やユーティリティを提供します。
type: application

# versionは、このHelmチャート自体のバージョンを指定します。
# チャートやテンプレートを変更する際は、このバージョンを更新する必要があります。
# セマンティックバージョニング（major.minor.patch）に従うことが推奨されています。
# 例: 1.0.0, 2.1.3など
version: 0.1.0

# appVersionは、デプロイされるアプリケーション自体のバージョンを指定します。
# これは、Helmチャートのバージョン(version)とは異なります。
# アプリケーションのコードを更新した際に、このバージョンを変更します。
# 例: Dockerイメージのタグと合わせて使用することが一般的です。
appVersion: "1.16.0"
